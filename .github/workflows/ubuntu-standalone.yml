name: Windows and Ubuntu x64 standalone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standalone-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-verify:
    name: Package and verify Windows and Ubuntu x64
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v5
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Lint Web application
        working-directory: web
        run: npm run lint

      - name: Build and run the complete Web regression suite
        working-directory: web
        run: npm test

      - name: Run standalone server tests
        run: node --test local-server/tests/*.test.mjs

      - name: Package Windows x64 standalone application
        run: node local-server/package-windows.mjs

      - name: Verify Windows package and offline runtime
        run: >-
          node local-server/verify-windows-package.mjs
          artifacts/windows/vth-similarity-windows-x64-v1.41.0.zip

      - name: Package Ubuntu x64 standalone server
        run: node local-server/package-ubuntu.mjs

      - name: Verify bundled runtime and start.sh
        run: >-
          node local-server/verify-ubuntu-package.mjs
          artifacts/ubuntu/vth-similarity-ubuntu-x64-v1.41.0.tar.gz

      - name: Upload verified Windows package
        uses: actions/upload-artifact@v6
        with:
          name: vth-similarity-windows-x64-v1.41.0
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/windows/vth-similarity-windows-x64-v1.41.0.zip
            artifacts/windows/vth-similarity-windows-x64-v1.41.0.zip.sha256

      - name: Upload verified Ubuntu package
        uses: actions/upload-artifact@v6
        with:
          name: vth-similarity-ubuntu-x64-v1.41.0
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ubuntu/vth-similarity-ubuntu-x64-v1.41.0.tar.gz
            artifacts/ubuntu/vth-similarity-ubuntu-x64-v1.41.0.tar.gz.sha256

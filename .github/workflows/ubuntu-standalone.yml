name: Ubuntu x64 standalone

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-standalone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-verify:
    name: Package and verify Ubuntu x64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js 24.14.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install Web dependencies
        working-directory: web
        run: npm ci

      - name: Build Web application
        working-directory: web
        run: npm run build

      - name: Package Ubuntu x64 standalone server
        run: node local-server/package-ubuntu.mjs

      - name: Verify bundled runtime and start.sh
        run: >-
          node local-server/verify-ubuntu-package.mjs
          artifacts/ubuntu/vth-similarity-ubuntu-x64-v1.33.0.tar.gz

      - name: Upload verified Ubuntu package
        uses: actions/upload-artifact@v4
        with:
          name: vth-similarity-ubuntu-x64-v1.33.0
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/ubuntu/vth-similarity-ubuntu-x64-v1.33.0.tar.gz
            web/public/downloads/vth-similarity-ubuntu-x64.sha256
            web/public/downloads/ubuntu-package-v1.33.0.json

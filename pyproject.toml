[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vnand-distribution-similarity-search"
version = "0.1.0"
description = "Similarity search for V-NAND measurement distributions"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "pillow>=10,<12",
  "scikit-learn>=1.3,<2",
  "scipy>=1.10,<2",
]

[project.optional-dependencies]
dev = [
  "jupyterlab>=4,<5",
  "pytest>=7.4,<9",
  "ruff>=0.3,<1",
  "seaborn>=0.13",
]

[project.scripts]
vnand-similarity = "vnand_similarity.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
ignore = [
  "PYI034", # typing.Self is unavailable in the Python 3.9 standard library.
  "UP045",  # Keep Optional[X] syntax parseable by the Python 3.9 runtime.
]
